name: Sync main to develop

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  create-sync-pr:
    name: Create Sync PR
    runs-on: ubuntu-latest
    concurrency:
      group: main-to-develop-sync
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Create Sync PR
        run: |
          PR_EXISTS=$(gh pr list --base develop --head main --state open --json number --jq '.[0].number // empty')
          echo "Existing PR number: $PR_EXISTS"

          if [ -n "$PR_EXISTS" ]; then
            echo "Sync PR #$PR_EXISTS already exists"
            exit 0
          fi

          AHEAD_BY=$(gh api "repos/${GITHUB_REPOSITORY}/compare/develop...main" --jq '.ahead_by // empty')
          if ! [[ "$AHEAD_BY" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to determine whether main is ahead of develop"
            exit 1
          fi

          if [ "$AHEAD_BY" -eq 0 ]; then
            echo "Develop already contains all commits from main"
            exit 0
          fi

          PR_URL=$(gh pr create --base develop --head main --title "main to develop sync" --body "This is an automated PR to sync main into develop" --label "ignore-for-release")
          echo "Created PR: $PR_URL"
          gh pr merge --auto --merge "$PR_URL"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

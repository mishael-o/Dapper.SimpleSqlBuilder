name: Continuous integration and delivery

on:
  push:
    branches: ["main", "develop"]
    paths:
      - "docs/github-pages/**"
      - "src/**"
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:
    inputs:
      publish_packages:
        description: "Force NuGet package publishing"
        default: false
        required: false
        type: boolean
      publish_docs:
        description: "Force GitHub Pages publishing"
        default: false
        required: false
        type: boolean
      create_sync_pr:
        description: "Create sync pull request?"
        default: false
        required: false
        type: boolean

env:
  configuration: release
  packagePath: ${{ github.workspace }}/packed-nuget

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    env:
      coverageReportPath: ${{ github.workspace }}/coverage-reports/
      mergedCoverageReportFileName: merged-coverage.xml
    outputs:
      package_version: ${{ steps.getversion.outputs.package_version }}
      should_publish_packages: ${{ steps.publish_decision.outputs.packages }}
      should_publish_docs: ${{ steps.publish_decision.outputs.docs }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.x
            8.x
      - name: Install Mono
        run: sudo apt-get install -y mono-complete
      - name: Restore dependencies
        run: dotnet restore
      - name: Build solution
        run: dotnet build --no-restore -c $configuration
      - name: Run unit tests
        run: dotnet test --no-build -c $configuration --filter-namespace "*UnitTests*" --ignore-exit-code 8 --results-directory ${{ env.coverageReportPath }} --coverlet --coverlet-output-format cobertura --coverlet-include "[Dapper.SimpleSqlBuilder*]*" --coverlet-exclude "[Dapper.SimpleSqlBuilder.UnitTestHelpers]*"
      - name: Run integration tests
        run: dotnet test --no-build -c $configuration --filter-namespace "*IntegrationTests*" --ignore-exit-code 8
      - name: Install dotnet-coverage
        run: dotnet tool install --global dotnet-coverage
      - name: Merge coverage reports
        run: dotnet-coverage merge ${{ env.coverageReportPath }}*.xml -f cobertura -o ${{ env.coverageReportPath }}${{ env.mergedCoverageReportFileName }}
      - name: Codecov
        uses: codecov/codecov-action@v7
        with:
          directory: ${{ env.coverageReportPath }}
          files: ${{ env.mergedCoverageReportFileName }}
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Get version
        id: getversion
        run: |
          nugetVersion=${{ env.GitBuildVersionSimple }}

          if ${{ github.ref_name == 'develop' }};
          then
            nugetVersion+="-beta"
          fi

          echo "package_version=$nugetVersion" >> $GITHUB_OUTPUT
      - name: Determine publishing targets
        id: publish_decision
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          publish_packages=false
          publish_docs=false

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            publish_packages="${{ inputs.publish_packages }}"
            publish_docs="${{ inputs.publish_docs }}"
          else
            before="${{ github.event.before }}"
            after="${{ github.sha }}"

            if [[ "$before" =~ ^0+$ ]]; then
              before="$(git hash-object -t tree /dev/null)"
            fi

            if ! git diff --quiet "$before" "$after" -- \
              src \
              ':(exclude)src/Tests/**' \
              ':(exclude)src/Benchmark/**'; then
              publish_packages=true
            fi

            if [[ "${{ github.ref_name }}" == "main" ]] &&
              ! git diff --quiet "$before" "$after" -- docs/github-pages; then
              publish_docs=true
            fi
          fi

          echo "Publish packages: $publish_packages"
          echo "Publish docs: $publish_docs"
          echo "packages=$publish_packages" >> "$GITHUB_OUTPUT"
          echo "docs=$publish_docs" >> "$GITHUB_OUTPUT"
      - name: Create nuget packages
        if: ${{ steps.publish_decision.outputs.packages == 'true' }}
        run: dotnet pack --no-build -o $packagePath -c $configuration
      - name: Upload artifacts
        if: ${{ steps.publish_decision.outputs.packages == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: artifacts
          path: ${{ env.packagePath }}
          retention-days: 7

  publish-packages:
    if: ${{ contains(fromJson('["main", "develop"]'), github.ref_name) && needs.build.outputs.should_publish_packages == 'true' }}
    name: Publish Packages
    needs: [build]
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: src

    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: artifacts
          path: ${{ env.packagePath }}
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push packages
        run: dotnet nuget push "${{ env.packagePath }}"/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Create Release Documentation
        if: ${{ success() }}
        run: |
          if gh release view 'v${{ needs.build.outputs.package_version }}' >/dev/null 2>&1;
          then
            echo 'Release v${{ needs.build.outputs.package_version }} already exists.'
            exit 0
          fi

          if ${{ github.ref_name == 'main' }};
          then
            gh release create 'v${{ needs.build.outputs.package_version }}' --title 'Release ${{ needs.build.outputs.package_version }}' --generate-notes
          else
            gh release create 'v${{ needs.build.outputs.package_version }}' --target ${{ github.ref_name }} --title 'Release ${{ needs.build.outputs.package_version }}' --generate-notes --prerelease
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-docs:
    if: ${{ github.ref_name == 'main' && needs.build.outputs.should_publish_docs == 'true' }}
    name: Publish Docs
    needs: [build]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/github-pages
    env:
      docfx_version: 2.78.5
      siteSubpath: ${{ github.event.repository.name }}

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      contents: read
      pages: write
      id-token: write

    # Allow only one concurrent deployment, skipping runs queued between the run in progress and the latest queued.
    # However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
    concurrency:
      group: "pages"
      cancel-in-progress: false

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x
      - name: Install DocFX
        run: dotnet tool update -g docfx --version ${{ env.docfx_version }}
      - name: Restore solution for DocFX metadata
        run: dotnet restore ../../src/Dapper.SimpleSqlBuilder.slnx
      - name: Generate Xrefmap
        run: _scripts/generate-xrefmap.sh ${{ env.siteSubpath }}
      - name: Generate Metadata
        run: _scripts/generate-metadata.sh
      - name: DocFx Build
        run: docfx build docfx.json --metadata _googleAnalyticsTagId="${{ vars.GA_TAG_ID }}"
      - name: Upload Doc Artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ github.workspace }}/docs/github-pages/_site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
  
  create-sync-pr:
    if: ${{ github.ref_name == 'main' && inputs.create_sync_pr == true }}
    name: Create Sync PR
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Create Sync PR
        run: |
          set +e
          PR_EXISTS=$(gh pr list --base develop --head main --state open --json number --jq '.[0]')
          echo "Existing PR number: $PR_EXISTS"

          if [ -z "$PR_EXISTS" ];
          then
            PR_URL=$(gh pr create --base develop --head main --title "main to develop sync" --body "This is an automated PR to sync main into develop" --label "ignore-for-release" 2>&1)
            CREATE_EXIT_CODE=$?        
            echo "Response: $PR_URL - Exit Code: $CREATE_EXIT_CODE"
          
            if [[ $CREATE_EXIT_CODE -eq 0 ]];
            then
              echo "Created PR: $PR_URL"
              gh pr merge --auto --merge "$PR_URL"
            fi

            exit 0;
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
